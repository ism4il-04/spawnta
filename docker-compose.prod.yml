services:

  backend:
    image: aymanesbe3/spawnta-backend:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    image: aymanesbe3/spawnta-frontend:${IMAGE_TAG:-latest}
    build: !reset null

  admin:
    image: aymanesbe3/spawnta-admin:${IMAGE_TAG:-latest}
    build: !reset null

  nginx:
    image: aymanesbe3/spawnta-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./devops/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - admin
  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  certbot_webroot:
