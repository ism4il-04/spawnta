apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        image: aymanesbe3/spawnta-admin:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  type: LoadBalancer # Or NodePort/Ingress depending on the cluster
  ports:
  - port: 81
    targetPort: 80
    name: http
  selector:
    app: admin
