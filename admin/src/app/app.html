<ng-container *ngIf="authService.currentAdmin$ | async as admin; else loginView">
<div class="admin-layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">S</span>
      <div>
        <strong>Spawnta</strong>
        <small>Admin</small>
      </div>
    </div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="material-symbol">dashboard</span>
        Dashboard
      </a>
      <a routerLink="/users" routerLinkActive="active">
        <span class="material-symbol">group</span>
        Utilisateurs
      </a>
      <a routerLink="/subscriptions" routerLinkActive="active">
        <span class="material-symbol">workspace_premium</span>
        Abonnements
      </a>
      <a routerLink="/moderation" routerLinkActive="active">
        <span class="material-symbol">shield</span>
        Moderation
      </a>
    </nav>

    <div class="admin-session">
      <span>{{ admin.firstName }} {{ admin.lastName }}</span>
      <small>{{ admin.email }}</small>
      <button type="button" (click)="logout()">
        <span class="material-symbol">logout</span>
        Deconnexion
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
</ng-container>

<ng-template #loginView>
  <main class="login-page">
    <section class="login-panel">
      <div class="brand login-brand">
        <span class="brand-mark">S</span>
        <div>
          <strong>Spawnta</strong>
          <small>Admin</small>
        </div>
      </div>

      <form (ngSubmit)="login()">
        <span class="kicker">Console admin</span>
        <h1>Connexion</h1>
        <p>Connectez-vous avec un compte administrateur pour gerer la plateforme.</p>

        <label>
          <span>Email</span>
          <input type="email" name="email" [(ngModel)]="email" autocomplete="username" required>
        </label>

        <label>
          <span>Mot de passe</span>
          <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required>
        </label>

        <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button type="submit" [disabled]="loading">
          <span class="material-symbol">login</span>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </section>
  </main>
</ng-template>
