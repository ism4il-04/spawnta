# ── Redirect HTTP → HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name spawnta.com www.spawnta.com;
 
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
 
    location / {
        return 301 https://$host$request_uri;
    }
}
 
# ── Main HTTPS server ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name spawnta.com www.spawnta.com;
 
    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/spawnta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spawnta.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
 
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
 
    # ── API traffic → Spring Boot ──────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
 
    # ── WebSocket (STOMP over SockJS) ──────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
 
    # ── Admin back-office ──────────────────────────────────────
    location /admin/ {
        proxy_pass http://admin:80/;
        proxy_set_header Host $host;
    }
 
    # ── User-facing Angular SPA ────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
