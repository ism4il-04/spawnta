<div class="verify-container">
  <mat-card class="verify-card">

    <!-- Loading -->
    <ng-container *ngIf="status === 'loading'">
      <mat-card-content class="centered">
        <mat-spinner diameter="48"></mat-spinner>
        <p>Verifying your email...</p>
      </mat-card-content>
    </ng-container>

    <!-- Success -->
    <ng-container *ngIf="status === 'success'">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="success-icon">check_circle</mat-icon>
          Email verified!
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Your account is active. Redirecting to your profile...</p>
      </mat-card-content>
    </ng-container>

    <!-- Error -->
    <ng-container *ngIf="status === 'error'">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="error-icon">error_outline</mat-icon>
          Verification failed
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ errorMessage }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="goToLogin()">Back to Login</button>
      </mat-card-actions>
    </ng-container>

  </mat-card>
</div>
