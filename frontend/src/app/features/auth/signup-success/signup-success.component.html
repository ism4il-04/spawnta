<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="success-icon">mark_email_unread</mat-icon>
        Check your inbox!
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>We sent a verification link to:</p>
      <p class="email-highlight">{{ email }}</p>
      <p class="hint">Click the link in the email to activate your account. Check your spam folder if you don't see it.</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="goToLogin()">Go to Login</button>
    </mat-card-actions>
  </mat-card>
</div>
