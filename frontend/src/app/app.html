<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/">Spawnta</a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
      <a routerLink="/map" routerLinkActive="active">Carte</a>
      <a *ngIf="authService.isLoggedIn()" routerLink="/chat" routerLinkActive="active" class="nav-msg-link">
        Messagerie
        <ng-container *ngIf="chatService.unreadCount$ | async as count">
          <span class="unread-badge" *ngIf="count > 0">
            {{ count > 9 ? '9+' : count }}
          </span>
        </ng-container>
      </a>
      <app-notifications-dropdown *ngIf="authService.isLoggedIn()"></app-notifications-dropdown>
      <a routerLink="/profile" routerLinkActive="active">Profil</a>
      <a *ngIf="!authService.isLoggedIn()" routerLink="/login" routerLinkActive="active">Connexion</a>
      <a *ngIf="!authService.isLoggedIn()" routerLink="/signup" routerLinkActive="active">Inscription</a>
      <button *ngIf="authService.isLoggedIn()" type="button" class="logout-btn" (click)="logout()">Deconnexion</button>
    </nav>
  </header>

  <main class="page-frame">
    <router-outlet></router-outlet>
  </main>
</div>
