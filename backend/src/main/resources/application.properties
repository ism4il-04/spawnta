spring.application.name=backend

# Use dev profile locally/docker unless overridden (e.g. prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load .env from project root (parent of backend/)
spring.config.import=optional:file:../.env[.properties]

# ── Database ──────────────────────────────────
# In Docker: jdbc:postgresql://postgres:5432/spawnta
# Locally: jdbc:postgresql://localhost:5432/spawnta
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:spawnta}
spring.datasource.username=${POSTGRES_USER:spawnta}
spring.datasource.password=${POSTGRES_PASSWORD:spawnta_dev_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────
# Flyway owns the schema. Hibernate only maps entities (dev profile may use update).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Redis ───────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:redis_dev_2024}

# ── Kafka ───────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=spawnta-chat-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ── JWT ─────────────────────────────────────
app.jwt.secret=${JWT_SECRET:my-super-secret-jwt-key-for-development-only-min-32-chars}
app.jwt.access-expiry=${JWT_ACCESS_EXPIRY:3600000}
app.jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800000}

# ── Flyway ─────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Cloudinary ──────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ── Actuator ───────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.loggers.enabled=true

# Info endpoint metadata
management.info.env.enabled=true
info.app.name=Spawnta
info.app.version=1.0.0

# Register this app with its own admin server

# ── Mail ──────────────────────────────────────
# Configuration Gmail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Disable Spring Boot Admin mail notifications (avoids startup conflict with mail starter)
spring.boot.admin.notify.mail.enabled=false
spring.autoconfigure.exclude=de.codecentric.boot.admin.server.config.AdminServerNotifierAutoConfiguration

# ── App URLs ───────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.boot.admin.client.url=http://localhost:8080
spring.boot.admin.client.instance.name=spawnta-backend
